<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a1e"/>
      <stop offset="1" stop-color="#ffab5c"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="24" height="24" rx="6" fill="url(#g)"/>
  <!-- A "P" (for PACT) traced entirely in the same node-graph vocabulary as
       the rest of the icon system - the mark reads as both a monogram and
       the multi-agent concept, instead of a generic network glyph in a
       rounded square. -->
  <g fill="none" stroke="#1a0f00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <line x1="7" y1="4" x2="7" y2="20"/>
    <line x1="7" y1="4" x2="16.5" y2="5.5"/>
    <line x1="16.5" y1="5.5" x2="14.5" y2="12"/>
    <line x1="14.5" y1="12" x2="7" y2="12"/>
  </g>
  <g fill="#1a0f00" stroke="none">
    <circle cx="7" cy="4" r="1.9"/>
    <circle cx="16.5" cy="5.5" r="1.9"/>
    <circle cx="14.5" cy="12" r="1.9"/>
    <circle cx="7" cy="12" r="1.9"/>
    <circle cx="7" cy="20" r="1.9"/>
  </g>
</svg>
